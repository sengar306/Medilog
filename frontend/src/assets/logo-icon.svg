<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Primary Neon Purple & Electric Blue Gradient -->
    <linearGradient id="mPlusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Secondary Glow Gradient -->
    <linearGradient id="plusCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Soft Lavender Glow Effect -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="50" cy="50" r="42" fill="#9333ea" opacity="0.12" filter="url(#purpleGlow)" />

  <!-- Smooth Geometric 'M' Path -->
  <path d="M 22 75 V 28 C 22 24.5 25 22 28.5 23.5 L 50 36 L 71.5 23.5 C 75 22 78 24.5 78 28 V 75 C 78 77.5 75.5 79.5 73 78.5 C 70.5 77.5 68 75.5 68 72 V 41 L 52 50 C 50.8 50.7 49.2 50.7 48 50 L 32 41 V 72 C 32 75.5 29.5 77.5 27 78.5 C 24.5 79.5 22 77.5 22 75 Z" 
        fill="url(#mPlusGrad)" 
        filter="url(#purpleGlow)" />

  <!-- Integrated Medical Plus '+' Symbol -->
  <g fill="url(#plusCrossGrad)" filter="url(#purpleGlow)">
    <!-- Horizontal Cross Bar -->
    <rect x="36" y="58" width="28" height="9" rx="4.5" />
    <!-- Vertical Cross Bar -->
    <rect x="45.5" y="48.5" width="9" height="28" rx="4.5" />
  </g>
</svg>
